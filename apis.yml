aid: thetaray
name: ThetaRay
description: >-
  ThetaRay is an Israeli/US financial-crime-compliance software company that applies its patented
  "Cognitive AI" anomaly-detection technology to anti-money-laundering (AML) transaction monitoring,
  sanctions and customer screening, PEP screening, and customer risk assessment for banks, fintechs
  and payment service providers. Its cloud-native SaaS platform ingests SWIFT and domestic payment
  traffic, KYC/customer data and risk indicators to surface suspected money laundering, terrorist
  financing and sanctions-evasion typologies in cross-border and domestic payments, with an agentic
  AI investigation product ("RAY") that automates and explains alert triage inside a single case
  manager. ThetaRay markets an API-based architecture for integrating monitoring and screening into
  existing workflows, and publishes a developer portal at api.thetaray.com — but that portal, the
  documentation host docs.thetaray.com, and every specification behind them sit behind customer SSO,
  so no machine-readable contract is publicly retrievable. Offices in New York, London, Madrid,
  Tel Aviv and Dubai; also distributed through the Microsoft commercial marketplace.
