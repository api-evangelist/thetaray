apis:
- name: ThetaRay Developer Portal API Surface
  description: >-
    ThetaRay publishes an API developer portal at api.thetaray.com, hosted on Redocly Cloud. The
    portal root redirects to /openapi and then to an OIDC login at auth.cloud.redocly.com, so the
    API reference and every OpenAPI document behind it require a customer account. The host does
    serve two anonymous discovery documents — an RFC 8414 OAuth 2.0 authorization server metadata
    document and an RFC 9728 protected-resource metadata document — and it exposes a live
    Model Context Protocol endpoint at /mcp which answers an unauthenticated request with a
    WWW-Authenticate Bearer challenge naming that resource metadata.
  humanURL: https://api.thetaray.com/openapi
  baseURL: https://api.thetaray.com
